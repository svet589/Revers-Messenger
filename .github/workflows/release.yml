name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create API_KEYS file
        run: |
          cat << 'EOF' > ./API_KEYS
          APP_ID = 6
          APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API = 0
          EOF
          cp ./API_KEYS ./TMessagesProj/API_KEYS || true

      - name: Show Gradle projects
        run: ./gradlew projects --no-daemon

      - name: Detect Gradle build task
        id: detect_task
        shell: bash
        run: |
          set -e

          echo "Available Gradle tasks:"
          ./gradlew tasks --all --no-daemon | tee gradle-tasks.log

          CANDIDATES=(
            ":TMessagesProj:assembleAfatDebug"
            ":app:assembleAfatDebug"
            "assembleAfatDebug"
            ":TMessagesProj:assembleDebug"
            ":app:assembleDebug"
            "assembleDebug"
          )

          SELECTED_TASK=""

          for TASK in "${CANDIDATES[@]}"; do
            echo "Checking task: $TASK"

            if ./gradlew "$TASK" --dry-run --no-daemon >/dev/null 2>&1; then
              SELECTED_TASK="$TASK"
              break
            fi
          done

          if [ -z "$SELECTED_TASK" ]; then
            echo "ERROR: No suitable Debug build task was found."
            echo
            echo "Tasks containing assemble/debug/release:"
            grep -i -E "assemble|debug|release|afat" gradle-tasks.log || true
            exit 1
          fi

          echo "Selected Gradle task: $SELECTED_TASK"
          echo "task=$SELECTED_TASK" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          ./gradlew "${{ steps.detect_task.outputs.task }}" \
            --no-daemon \
            --stacktrace \
            --build-cache

      - name: Find generated APK files
        shell: bash
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: revers-messenger-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
