name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate debug keystore and setup signing keys
        run: |
          mkdir -p ./TMessagesProj/config

          # Генерируем тестовый keystore прямо на раннере
          keytool -genkey -v -keystore ./TMessagesProj/config/extera.jks \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          # Дублируем его под стандартным именем debug.keystore
          cp ./TMessagesProj/config/extera.jks ./TMessagesProj/config/debug.keystore || true

          # Заполняем API_KEYS всеми свойствами, которые проверяет сборщик
          cat << 'EOF' > ./API_KEYS
          APP_ID = 6
          APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API = 0

          SIGNING_KEY_PASSWORD = "android"
          SIGNING_KEY_ALIAS = "androiddebugkey"
          SIGNING_KEY_STORE_PASSWORD = "android"
          KEYSTORE_PASS = "android"
          ALIAS_NAME = "androiddebugkey"
          ALIAS_PASS = "android"
          EOF

          cp ./API_KEYS ./TMessagesProj/API_KEYS || true
          cp ./API_KEYS ./TMessagesProj/src/main/API_KEYS || true

      - name: Create dummy google-services.json
        run: |

      - name: Show Gradle projects
        run: ./gradlew projects --no-daemon

      - name: Create dummy google-services.json
        run: |
          cat << 'EOF' > ./google-services-dummy.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "revers-messenger",
              "storage_bucket": "revers-messenger.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                  "android_client_info": {
                    "package_name": "com.radolyn.ayugram"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "fake_key" } ],
                "services": { "analytics_service": { "status": 1 } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdeg",
                  "android_client_info": {
                    "package_name": "com.radolyn.ayugram.beta"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "fake_key" } ],
                "services": { "analytics_service": { "status": 1 } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdeh",
                  "android_client_info": {
                    "package_name": "org.telegram.messenger"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "fake_key" } ],
                "services": { "analytics_service": { "status": 1 } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0123456789abcdei",
                  "android_client_info": {
                    "package_name": "org.telegram.messenger.beta"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "fake_key" } ],
                "services": { "analytics_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          mkdir -p TMessagesProj/src/beta
          mkdir -p TMessagesProj/src/debug
          cp ./google-services-dummy.json ./TMessagesProj/google-services.json
          cp ./google-services-dummy.json ./TMessagesProj/src/beta/google-services.json
          cp ./google-services-dummy.json ./TMessagesProj/src/debug/google-services.json
          
      - name: Detect Gradle build task
        id: detect_task
        shell: bash
        run: |
          set -e
          ./gradlew tasks --all --no-daemon > gradle-tasks.log

          CANDIDATES=(
            ":TMessagesProj:assembleAfatDebug"
            ":app:assembleAfatDebug"
            "assembleAfatDebug"
            ":TMessagesProj:assembleDebug"
            ":app:assembleDebug"
            "assembleDebug"
          )

          SELECTED_TASK=""
          for TASK in "${CANDIDATES[@]}"; do
            echo "Checking task: $TASK"
            if ./gradlew "$TASK" --dry-run --no-daemon >/dev/null 2>&1; then
              SELECTED_TASK="$TASK"
              break
            fi
          done

          if [ -z "$SELECTED_TASK" ]; then
            echo "ERROR: No suitable build task found."
            exit 1
          fi

          echo "Selected: $SELECTED_TASK"
          echo "task=$SELECTED_TASK" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          ./gradlew "${{ steps.detect_task.outputs.task }}" \
            --no-daemon \
            --stacktrace \
            --build-cache

      - name: Find generated APK files
        shell: bash
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: revers-messenger-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILES=$(find . -type f -name "*.apk")
          gh release create "${GITHUB_REF_NAME}" $APK_FILES --title "Release ${GITHUB_REF_NAME}" --generate-notes
